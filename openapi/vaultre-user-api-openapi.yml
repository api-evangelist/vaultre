      summary: Retrieve a list of upcoming offer conditions for the authenticated user
      description: Retrieve a list of upcoming offer conditions for the authenticated user
      operationId: getUserUpcomingOfferConditions
      parameters:
      - name: days
        in: query
        description: Number of days to look ahead and back (default 8)
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pagesize'
      responses:
        200:
