  /account/users:
    get:
      tags:
      - user
      summary: Retrieve a list of users in the authenticated account
      description: Retrieve a list of users in the authenticated account
      operationId: getAccountUsers
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pagesize'
      - name: team
        in: query
        description: Filter users belonging to the given team ID
        schema:
          type: integer
          format: int64
      - name: sort
        in: query
        description: Field by which to sort the results.
        schema:
          type: string
          enum:
          - firstname
          - lastname
          - inserted
      - $ref: '#/components/parameters/sortOrder'
      responses:
        200:
          description: Account users retrieved
          content: {}
      security:
      - Api-Key: []
        Bearer: []
    post:
      tags:
      - user
      summary: Add a new user in the authenticated account
      description: Add a new user
      operationId: addUser
      requestBody:
        description: User object
        content:
          application/json:
            schema:
              type: object
              required:
              - firstName
              - lastName
              - email
              - staffTypeId
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                  format: email
                username:
                  type: string
                password:
                  type: string
                staffTypeId:
                  type: integer
                  format: int64
                  enum:
                  - 1
                  - 2
                  - 3
                  - 4
                  description: '1: Salesperson, 2: Administration, 3: Property Manager, 4: Principal'
                position:
                  type: string
                phoneNumbers:
                  type: array
                  items:
                    $ref: '#/components/schemas/PhoneNumber_3'
                profile:
                  type: string
                externalReference:
                  type: string
                ssoIdentifier:
                  type: string
                adminAccess:
                  type: boolean
                permissions:
                  type: object
                  properties:
                    canLogin:
                      type: boolean
      responses:
        201:
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User_3'
        400:
          description: Invalid data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessOrError'
      security:
      - Api-Key: []
        Bearer: []
      x-codegen-request-body-name: body
    servers:
    - url: https://ap-southeast-2.api.vaultre.com.au/api/v1.1
  /account/users/{id}:
