        parameter.
      schema:
        type: string
        enum:
        - asc
        - desc
    leasedSince:
      name: leasedSince
      in: query
      description: Filter results leased since this datetime
      schema:
        type: string
        format: date-time
    leasedBefore:
      name: leasedBefore
      in: query
      description: Filter results leased before this datetime
      schema:
        type: string
        format: date-time
    listingAuthoritySince:
      name: listingAuthoritySince
      in: query
      description: Filter results with listing authority date since this datetime
      schema:
        type: string
        format: date-time
    listingAuthorityBefore:
