aid: vaultre
url: https://raw.githubusercontent.com/api-evangelist/vaultre/refs/heads/main/apis.yml
name: VaultRE
kind: company
description: >-
  VaultRE - now marketed as MRI Vault CRM, after VaultRE's parent Vault Group / PropTech
  Group was absorbed into MRI Software - is an Australian cloud real estate CRM and
  transaction platform used by residential, commercial, rural, land, business and
  property-management agencies across Australia and New Zealand. It sits in the agency
  and CRM layer of the value chain rather than the portal or registry layer: it holds
  the agency's contacts, appraisals, listings, offers, open homes, feedback, tenancies,
  maintenance, invoicing and AML records, and feeds listings outward to Australia's portal
  duopoly (realestate.com.au and Domain) instead of being a portal, a land registry or a
  conveyancing rail itself. Unlike most of this sector, VaultRE publishes a genuinely open,
  versioned, machine-readable contract - a public MkDocs developer site at
  docs.api.vaultre.com.au carrying downloadable OpenAPI 3.0.1 documents for v1.1, v1.2 and
  v1.3 of the core API (324 paths and 453 operations in v1.3) plus a separate Aggregator
  API for franchise-group CRM data feeds. The API surface is documented openly but access
  is not self-serve: anyone can read the docs and download the specs, but API keys are
  issued only after an integrator-registration request is reviewed and approved (VaultRE
  states new integrations are generally created within two business days), and each agency
  must then mint a scoped access token for that integrator from inside its own VaultRE
  account. RESO plays no part here - Australia has no RESO mandate and no RESO, OData or
  $metadata reference appears anywhere in VaultRE's documentation or specifications; the
  local listing-distribution seam is REAXML and portal-specific feeds instead. Auth is a
  static X-Api-Key integrator key paired with a per-account Bearer access token, with an
  OAuth2-style authorisation-code flow available for token minting, scoped tokens
  readable via GET /scopes, HMAC-SHA512-signed webhooks, and published rate limits of 10
  requests per second and 10,000 requests per day.
