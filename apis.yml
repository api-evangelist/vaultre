- aid: vaultre:vaultre-integrator-api
  name: VaultRE Integrator API
  description: >-
    A distinct set of endpoints that operate at the integrator level rather than at an
    individual agency-account level, letting an approved integrator enumerate the accounts
    that have granted it an access token, list users on those accounts, validate a user,
    read granted scopes, list tokens, retrieve account-scoped merge fields, and read its
    own API usage. These endpoints replace the customer-supplied Bearer token with a
    short-lived HS512 JWT the integrator signs itself, carrying its API key and a current
    epoch timestamp and valid for 300 seconds, alongside the same X-Api-Key header.
  humanURL: https://docs.api.vaultre.com.au/integrator.html
  baseURL: https://ap-southeast-2.api.vaultre.com.au/api/v1.3/integrator
  tags:
  - Integrator
  - Accounts
  - Scopes
  - Usage
  properties:
