apis:
- aid: vaultre:vaultre-api
  name: VaultRE API
  description: >-
    The core VaultRE REST API - the open API a third-party developer integrates an agency
    website or application against. Version 1.3 documents 324 paths and 453 operations
    covering contacts, properties across every life type (residential, commercial, rural,
    land, business, holiday rental, livestock, clearing sales), listings and photos,
    enquiries, offers and offer conditions, open homes, feedback, appraisals, calendar and
    tasks, inspections, maintenance and suppliers, tenancies, invoices, deals, campaigns
    and advertising, templates, merge fields, SMS and email messaging, AML checks, keys,
    suburbs and precincts, an event-stream poll endpoint, CoreLogic property and AVM
    lookups, and REINZ sales reporting for New Zealand. Every request carries both an
    integrator X-Api-Key header and a per-account Bearer access token; the granted scopes
    on a token are readable from GET /scopes.
  humanURL: https://docs.api.vaultre.com.au/swagger/index.html
  baseURL: https://ap-southeast-2.api.vaultre.com.au/api/v1.3
