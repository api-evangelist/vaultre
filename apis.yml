    url: openapi/vaultre-api-v1-3-openapi.yml
  - type: Documentation
    url: https://docs.api.vaultre.com.au/integrator.html
  - type: APIReference
    url: https://docs.api.vaultre.com.au/swagger/index.html
  - type: SourceCode
    url: https://github.com/VaultGroup/api-samples/blob/master/python/create_jwt.py
  - type: Authentication
    url: authentication/vaultre-authentication.yml
  - type: OAuthScopes
    url: scopes/vaultre-scopes.yml
- aid: vaultre:vaultre-aggregator-api
  name: VaultRE Aggregator API
  description: >-
    A deliberately separate write-only ingestion API that lets other CRM systems feed
    property data into VaultRE on behalf of a franchise-group agency. Six documented
    operations accept staff records and property lifecycle events - appraisal, listing,
    unconditional sale, settlement and withdrawn listing. Submissions are queued rather
    than processed live, returning HTTP 202 on successful receipt, with validation and
    processing errors delivered asynchronously to a nominated webhook URL. Authentication
    uses a per-aggregator Secret Key in the X-Api-Key header plus a self-signed HS512 JWT
    bearing the aggregator's CRM Key, valid for 120 seconds.
  humanURL: https://docs.api.vaultre.com.au/swagger/aggregator/index.html
  baseURL: https://aggregator.api.vaultre.com.au/api/v1.0
  tags:
  - Aggregator
  - Property Data
  - Franchise
  - Ingestion
  properties:
  - type: OpenAPI
    url: openapi/vaultre-aggregator-api-v1-0-openapi.yml
  - type: APIReference
