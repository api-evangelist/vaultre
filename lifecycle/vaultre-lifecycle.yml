deprecation:
  policy_url: https://docs.api.vaultre.com.au/guide.html
  formal_policy: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    VaultRE publishes a compatibility promise (additive-only within a minor version)
    but no formal deprecation policy: no retirement window, no end-of-life dates for
    v1.1 or v1.2, and no RFC 8594 Sunset/Deprecation headers. What stands in for a
    deprecation policy is the practice of keeping older minor versions live and
    downloadable indefinitely.
