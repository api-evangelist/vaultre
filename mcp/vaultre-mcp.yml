- https://registry.npmjs.org — no @vaultre / vaultre MCP package
provider_publishes_mcp: false
provider_note: >-
  VaultRE publishes NO MCP server for its product API. The VaultGroup GitHub org does
  host https://vaultgroup.github.io/vaultre-mcp-registry/registry.json (HTTP 200), but
  inspection shows it is internal engineering tooling for a "vaultre-copilot-bot" — the
  registered servers wrap Atlassian, Zendesk, GitHub and Elasticsearch, not the VaultRE
  API. It is deliberately excluded here and from apis.yml.
disclosure: >-
  This manifest is API Evangelist-derived, not provider-published. It is a candidate
  tool surface projected from VaultRE's own OpenAPI 3.0.1 document — every tool below
  binds to a real operationId that exists verbatim in that spec, and each tool's true
  input schema is that operation's parameters + requestBody. Nothing here is hosted by
  VaultRE and no endpoint is invented.
server:
  name: vaultre
  transport: http
  url: null
  status: not published
auth_model:
  note: >-
    Any MCP server fronting this API must carry BOTH credentials on every call —
    X-Api-Key (integrator key) and Authorization: Bearer (per-agency customer access
    token). Because the customer token is per-account and customer-revocable, a
    multi-tenant server needs one credential pair per agency, and should call
    getTokenScopes at session start to learn what the token is actually allowed to do.
  artifact: authentication/vaultre-authentication.yml
safety:
  note: >-
    This is an agency system of record holding private CRM data — contacts, offers,
    tenancies, trust records and AML checks. The read tools below are the safe default
    surface; the write tools are marked and should require human confirmation. Per-op
    execution contracts are classified in agentic-access/vaultre-agentic-access.yml.
