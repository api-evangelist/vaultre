tier-reason: >-
  Tier-1 on contract quality despite a gated data surface - VaultRE publishes and serves
  four complete, parseable, versioned OpenAPI 3.0.1 documents anonymously, alongside real
  public documentation, signed webhooks, published rate limits and an active changelog.
  The gate is on keys and customer consent, not on the contract.
