developerSurface:
  developerPortal: https://docs.api.vaultre.com.au/
  portalConfirmed: true
  portalNote: >-
    HTTP 200, publicly readable with no login, generated by mkdocs-1.4.2 /
    mkdocs-material-8.5.10. Sitemap declares exactly 9 pages. This is a real public
    documentation portal, but it is a docs site rather than a self-serve developer console -
    there is no signup-and-call flow and no key issuance in the browser.
  interactiveConsole: >-
    Yes, in a limited sense - the Swagger UI at /swagger/index.html allows "try it out"
    requests against the live API, but only for someone who already holds an API key and a
    customer access token.
  sandbox: false
  sandboxNote: No sandbox, demo account, or free test dataset is offered publicly.
  rateLimits: >-
    Published in the technical guide: 10 requests per second and 10,000 requests per day
    per API Key, quota resetting at 00:00 UTC, HTTP 429 when exceeded. VaultRE explicitly
    advises against calling the API live per page load and recommends periodic
    synchronisation and local caching.
  versioning: >-
    Minor versions 1.1, 1.2 and 1.3 are all published simultaneously. Within a minor
    version VaultRE commits to additive-only changes (new fields may appear, fields will
    not be removed or retyped); breaking changes are reserved for version bumps. Consumers
    are told to tolerate arbitrary new fields.
  changelog: >-
    Public and actively maintained at /changelog.html (98KB), segmented by version, with
    dated entries through 2026-05-29 - recent examples include a source field on external
    feedback, GET /merge-fields, and GET /contacts/{contactid}/gdpr for consent records.
  sdks: >-
    No official SDK or client library is published. The only code VaultRE ships is the
    sample repository github.com/VaultGroup/api-samples (curl, PHP, Perl and Python
    samples, last pushed 2024-07-24, no licence file). A WordPress Contact Form 7 plugin
    (VaultGroup/wp-plugin-contact-form-7) also exists in the org.
  postman: false
  postmanNote: No Postman collection or workspace is published.
  webhooks: true
  mcp:
    exists: false
    note: >-
      VaultRE publishes no MCP server for its product API. The org does host a public
      repository named VaultGroup/vaultre-mcp-registry serving
      https://vaultgroup.github.io/vaultre-mcp-registry/registry.json (HTTP 200), but
      inspection shows it is INTERNAL ENGINEERING TOOLING for a "vaultre-copilot-bot" -
      the five registered servers wrap Atlassian, Zendesk, GitHub and Elasticsearch, not
      the VaultRE API. It must not be counted as an agent-facing artifact for the VaultRE
      product API.
  githubOrg:
    url: https://github.com/VaultGroup
    name: Vault Group Pty Ltd
    publicRepos: 15
    note: Mostly mobile/Flutter/iOS forks; api-samples is the only API-facing repo.
ownership:
  operatingName: VaultRE
  marketedAs: MRI Vault CRM
  legalEntityOnGitHub: Vault Group Pty Ltd
  parent: MRI Software
  evidence: |
    vaultre.com.au returns HTTP 301 and resolves to
    https://www.mrisoftware.com/au/products/vault/ (HTTP 200), whose title is
    "MRI Vault | Formerly VaultRE | MRI Software AU". The integrator registration page at
    resources.vaultre.com.au is titled "Request integration access to the MRI Vault API -
    MRI Software | AU". The MCP registry references a Zendesk subdomain "proptech-group",
    consistent with the PropTech Group lineage. No acquisition date is asserted here
    because none was verified from a primary source during this review.
  caution: >-
    vaultgroup.com.au is an unrelated accountancy business ("The Accountants") and is NOT a
    VaultRE property. It was probed and excluded.
strengths:
- Four complete OpenAPI 3.0.1 documents downloadable anonymously with HTTP 200 - rare in
  this sector and rarer still outside North America.
- Large, honestly-tagged surface - 324 paths and 453 operations in v1.3 across the full
  agency lifecycle.
- Three minor versions published side by side with an explicit additive-only compatibility
  promise.
- Public, dated, actively maintained changelog through 2026-05-29.
- Real webhooks with HMAC-SHA512 request signing and replay protection, plus a polling
  event stream as an alternative.
- Customer-controlled, scoped, revocable per-account tokens with a readable GET /scopes.
- Published rate limits and explicit caching guidance.
- Documentation is plain, honest and free of marketing - it names the two-step access
  reality up front.
weaknesses:
- Not self-serve. Nothing can be called without a reviewed approval and a separate
  per-agency token grant.
- No sandbox, demo tenant or public test dataset, so the specs cannot be exercised at all
  before approval.
- No official SDKs; the sample repo has not been pushed since July 2024 and carries no
  licence.
- No Postman collection, no AsyncAPI for the webhook/event surface, no MCP server for the
  product API.
- OAuth flow is hand-rolled CGI with no OpenID Connect discovery (/.well-known/
  openid-configuration is 404) and no dynamic client registration; client_id issuance is by
  email.
- Redirect URIs must be enumerated literally including query strings, which is brittle.
- No published API pricing or plans.
- Single region only - the sole documented core host is ap-southeast-2.
- Scope vocabulary is not documented anywhere; it is only discoverable at runtime from a
  live token.
