aid: vaultre
name: VaultRE
review:
  question: >-
    Does VaultRE expose a real, publicly documented, machine-readable API surface, and what
    does a developer actually have to do to get in?
  answer: >-
    Yes - public docs and downloadable OpenAPI, but approval-gated keys plus per-agency
    token grant.
  date: '2026-07-26'
  reviewer: API Evangelist
  openapiHarvested: true
  openapiScopeNote: |
    Four OpenAPI 3.0.1 documents were harvested verbatim from VaultRE's own public
    Swagger UI bootstrap at https://docs.api.vaultre.com.au/swagger/index.html (which
    declares three versioned spec URLs) and
    https://docs.api.vaultre.com.au/swagger/aggregator/index.html. All four downloaded
    with HTTP 200 and all four parse cleanly with PyYAML. Nothing was reconstructed,
    inferred, or authored - every path, operation and security scheme in openapi/ came
    off VaultRE's servers on 2026-07-26.
findings:
  summary: |
    VaultRE is an Australian real estate CRM and transaction platform - residential,
    commercial, rural, land, business, holiday-rental, livestock and clearing-sales
    property lives, plus property management, trust/invoicing and AML - serving agencies
    across Australia and New Zealand. It is now marketed as "MRI Vault CRM": vaultre.com.au
    301-redirects to https://www.mrisoftware.com/au/products/vault/ (page title
    "MRI Vault | Formerly VaultRE | MRI Software AU"), and the integrator registration page
    is titled "Request integration access to the MRI Vault API - MRI Software | AU". The
    VaultRE brand and hostnames remain live and are what the API and docs still use.

    In the value chain VaultRE is the agency system of record, not a portal, a land
    registry or a conveyancing rail. In the Australian seam described for this study -
    REA Group and Domain as the portal duopoly, PEXA as the mandated e-conveyancing
    network, PropTrack and CoreLogic as the valuation concentration - VaultRE is the CRM
    that feeds listings outward and pulls valuation data inward. That dependency is visible
    in the spec itself: v1.3 carries a `corelogic` tag with GET /corelogic/properties/{id},
    /avm, /rentalavm, /disclaimers and /suggest/address/corelogic, i.e. CoreLogic AVM
    access proxied through VaultRE rather than a VaultRE-owned valuation model. A `reinz`
    tag (GET /reinz/sales) covers New Zealand sales reporting. No PEXA, no land-registry
    and no title endpoints exist in any harvested spec.

    The developer surface is real and unusually open for this sector. docs.api.vaultre.com.au
    is a public MkDocs-Material site (9 pages: overview, getting started, technical guide,
    integrator endpoints, aggregator, oAuth, webhooks, samples, changelog) with no login
    wall, and it links directly to downloadable OpenAPI documents. What is NOT open is
    access: keys are issued only after a reviewed application, and each agency must then
    grant the integrator a scoped token from inside its own account.
  transports:
  - protocol: REST
    scheme: https
    baseURL: https://ap-southeast-2.api.vaultre.com.au/api/v1.3
    documented: true
    note: >-
      Confirmed live. GET /api/v1.3/contacts returns HTTP 401 anonymously - the host is up
      and rejecting unauthenticated calls, not absent.
  - protocol: REST
    scheme: https
    baseURL: https://aggregator.api.vaultre.com.au/api/v1.0
    documented: true
    note: >-
      Confirmed live. POST-only ingestion surface; GET /api/v1.0/staff returns HTTP 403
      anonymously.
  - protocol: Webhooks
    scheme: https
    documented: true
    note: >-
      Outbound HTTP POST JSON events to a subscriber-nominated URL. Payloads carry an
      X-VaultRE-Signature header of the form t=<ms timestamp>,sha512=<hmac> - HMAC-SHA512
      over "<timestamp>.<raw JSON body>" using the integrator's API key as the secret,
      explicitly modelled on Stripe webhook signatures. Documented as receiving no other
      authentication.
  - protocol: Polling event stream
    scheme: https
    documented: true
    note: >-
      GET /eventStream ("Poll the event stream") exists in the v1.3 spec as a pull-based
      alternative to webhooks.
  - protocol: WebSocket
    scheme: wss
    documented: false
    note: No WebSocket or streaming surface is documented or present in any harvested spec.
  - protocol: OData
    scheme: https
    documented: false
    note: >-
      No OData surface. GET https://ap-southeast-2.api.vaultre.com.au/api/v1.3/$metadata
      returns HTTP 404.
sectorPosture:
  homeMarket: Australia
  secondaryMarkets:
  - New Zealand
  valueChainPosition: >-
    Agency CRM / transaction system of record. Upstream of the portal duopoly (feeds
    listings out), downstream of valuation providers (proxies CoreLogic AVM), and entirely
    absent from title, land registry and e-conveyancing (no PEXA surface).
  resoPosture: >-
    No RESO reference found - RESO is absent from VaultRE's entire public surface, which is
    the honest and expected answer for an Australian CRM.
  resoCertified: false
  resoEvidence: |
    Probed and found nothing:
      - Full-text search of all 9 docs.api.vaultre.com.au pages for "RESO", "OData",
        "$metadata", "Data Dictionary", "Universal Property Identifier" and "UPI" returned
        only two hits, both false positives on the substring "reso" inside the URL
        https://resources.vaultre.com.au/api-integrations.
      - Full-text search of all four harvested OpenAPI documents (763KB, 435KB, 225KB and
        12KB) for "RESO", "OData", "$metadata" and "Data Dictionary" returned zero matches.
      - GET https://ap-southeast-2.api.vaultre.com.au/api/v1.3/$metadata returned HTTP 404;
        no OData service document or CSDL exists.
      - No RESO Web API certification, no RESO Data Dictionary certification (no version
        1.7, 2.0 or otherwise), no RESO certification directory listing, and no UPI usage
        is claimed anywhere by VaultRE.
    This is the correct sector reading rather than a gap: RESO is a North American
    (NAR/MLS) construct. Australia has no MLS system and no RESO mandate. The equivalent
    Australian machine-readable listing contract is REAXML plus portal-specific feeds,
    and VaultRE's own answer to the same problem is its Aggregator API - a proprietary
    JSON ingestion contract for franchise groups, not a standards-body one.
  certificationVsReachability: >-
    VaultRE inverts the pattern this study is testing. There is no certification at all,
    yet the machine-readable contract is more reachable than most certified US endpoints:
    four OpenAPI documents are downloadable anonymously with HTTP 200 by anyone, and the
    contract is versioned with a public changelog. Certification and reachability are
    genuinely independent here - VaultRE has zero of the former and a great deal of the
    latter, while the DATA behind the contract remains fully gated.
accessGate:
  gate: application-approval
  gated: true
  selfServe: false
  publicDocs: true
  publicSpecs: true
  whatADeveloperMustDo: |
    Two separate steps, both required, neither self-serve:
      1. REGISTER AS AN APPROVED INTEGRATOR. Submit the integration-request form at
         https://resources.vaultre.com.au/api-integrations (HTTP 200, publicly reachable,
         no login). VaultRE states: "We review each integration request to ensure the best
         experience for our mutual customers ... generally new integrations are created
         within two business days. Once setup you will receive an email with your API
         credentials." The docs put it plainly: "Before your web developer can access the
         VaultRE API, they need to be registered as an approved integrator with VaultRE."
         Approval yields the integrator's API Key.
      2. BE GRANTED A TOKEN BY EACH AGENCY. The API Key alone opens nothing. The VaultRE
         customer must go to Office Integrations > Third-Party Access inside their own
         account, select the integrator from a dropdown and click "Create Token", then hand
         that Access Token to the developer. The customer chooses the scopes on the token
         and can revoke it at any time. One token per customer, so an integrator serving
         many agencies holds many tokens.
    The Aggregator API is a third, separate registration - "When you register for
    Aggregator access, VaultRE will provide you with a unique CRM Key and Secret Key" - and
    the docs state it is "completely separate to the core VaultRE API".
  notRequired: |
    No MLS or board membership (none exists in Australia), no real estate licence, no
    broker sponsorship, no IDX/VOW data licence, and no signed data-licence agreement is
    named as a precondition in the public documentation. The gate is commercial/operational
    approval plus the customer's own consent, not membership or licensure.
  pricing: >-
    No public pricing for API access is published. The MRI Vault product site prices the
    CRM, not the API.
  contact: api@vaultre.com.au
authModel:
  scheme: API key + bearer token (both required on every request)
  headers:
  - name: X-Api-Key
    value: integrator API Key
    note: Missing or invalid returns HTTP 403 Forbidden per the technical guide.
  - name: Authorization
    value: Bearer <customer access token>
    note: Per-agency token, scoped by the customer, revocable by the customer.
  securitySchemesInSpec:
    v1_3: [Api-Key (apiKey, header, X-Api-Key), Bearer (http, bearer)]
    v1_2: [Api-Key, Bearer]
    v1_1: [Api-Key, Bearer]
    aggregator_v1_0: [ApiKey, Bearer]
  oauth: |
    An OAuth2-style authorisation-code flow is offered for minting customer tokens without
    handling VaultRE credentials. Authorisation endpoints:
      https://login.vaultre.com.au/cgi-bin/clientvault/oauth-authorize.cgi       (third-party / office-account tokens)
      https://login.vaultre.com.au/cgi-bin/clientvault/oauth-authorize-user.cgi  (user-level tokens)
    Token exchange (server-side only; CORS blocks browser exchange):
      POST https://login.vaultre.com.au/cgi-bin/clientvault/integrations/oauthexchange.cgi
    Parameters are client_id, redirect_uri, response_type=code, optional state. The
    authorisation code is valid for 60 seconds. Redirect URIs must be registered
    explicitly, including any query string - VaultRE matches them literally, not by prefix.
    The client_id is issued out-of-band by emailing api@vaultre.com.au and is a different
    value from the API key. There is no dynamic client registration.
  jwt: |
    Integrator-level and Aggregator endpoints replace the customer bearer token with a
    self-signed HS512 JWT. Integrator payload {"apiKey": ..., "timestamp": <epoch s>},
    valid 300 seconds. Aggregator payload {"crmKey": ..., "timestamp": <epoch s>}, valid
    120 seconds. Both signed with a VaultRE-provided secret key.
  oidc: |
    Not OpenID Connect. GET https://login.vaultre.com.au/.well-known/openid-configuration
    returns HTTP 404, as does the same path on ap-southeast-2.api.vaultre.com.au. The
    OAuth flow is hand-rolled CGI, not a standards-discoverable OP.
  scopes: >-
    Scopes are real and customer-assigned per token. GET /scopes ("Retrieve a list of
    granted scopes for this bearer token", operationId getTokenScopes) returns an array of
    strings; GET /integrator/scopes is the integrator-authenticated equivalent. The spec
    does not enumerate the scope vocabulary, and no scope names were invented here.
openData:
  exists: false
  note: >-
    Nothing VaultRE publishes is open data. Every dataset behind the API is an individual
    agency's private CRM data - contacts, listings, offers, tenancies, trust records, AML
    checks - reachable only with that agency's consent. The Australian open-data
    counterweights in this sector sit elsewhere (state land registries, ABS, data.gov.au),
    not with a CRM vendor. VaultRE additionally forbids hotlinking its property images and
    requires integrators to download and self-host them.
