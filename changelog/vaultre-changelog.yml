- date: '2026-05-29'
  version: '1.3'
  breaking: false
  additions:
  - 'POST /properties/{propertyid}/{salelease}/{lifeid}/externalFeedback now accepts an optional source object with an id field'
  - 'PUT /properties/{propertyid}/{salelease}/{lifeid}/externalFeedback/{id} — new endpoint to update an existing external feedback entry'
  - 'GET /account/enquirySources returns the available source-of-enquiry options'
  highlights: >-
    External feedback gains a source-of-enquiry field and now supports franchise shared
    listings, so users in the same franchise and country can post feedback on properties
    they do not own.
- date: '2026-04-28'
  version: '1.3'
  breaking: false
  additions:
  - 'GET /merge-fields — merge fields for a template type and delivery method (email, SMS, cloud letter), filterable by context, include_custom and search'
  - 'GET /integrator/merge-fields — integrator-authenticated equivalent, scoped to an account'
  highlights: Template merge fields become machine-readable for both account and integrator auth.
- date: '2026-03-12'
