summary:
  documents_found: 0
  note: >-
    VaultRE exposes no /.well-known/ discovery surface on any host. This is a recorded
    negative result, not an un-run probe: every path below was requested on 2026-07-26.
    The docs and aggregator hosts are static S3/CDN origins that answer any unknown key
    with HTTP 403 (AccessDenied); the API host and the login host answer 404. No
    security.txt, no OIDC discovery document, no RFC 8414 authorization-server metadata,
    no RFC 9727 api-catalog, no ai-plugin.json. Consistent with the review finding that
    VaultRE's OAuth implementation is a hand-rolled CGI flow rather than a
    standards-discoverable OpenID Provider. No `WellKnown` or `SecurityTxt` pointer is
    wired into apis.yml because there is nothing to point at.
